name: Baseline develop

# R0 proved UNMODIFIED develop builds on Linux + macOS (x2). With the native-Windows
# port now on this branch, this workflow doubles as the R6 multi-platform check:
#   - Linux + macOS jobs re-build via upstream's own Docker/prebuilt-LLVM path. Since
#     every Windows change is _WIN32/isWinMSVC-guarded, these MUST stay green (regression
#     guard that the port didn't touch the other platforms).
#   - The Windows job builds the exaloop LLVM fork 20.1.7 from source (no Windows prebuilt
#     exists upstream), then builds codon with MSVC/clang+lld and smoke-tests codon.exe.
# Kept separate from ci.yml so the upstream workflow stays pristine until the PR.

on:
  workflow_dispatch:
  push:
    branches:
      - windows-next

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: macos-15-intel
            arch: darwin-x86_64
          - os: macos-14
            arch: darwin-arm64
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          (cd .github/build-linux && docker build -t local -f Dockerfile.${{ matrix.arch }} .)
          docker run -v $(pwd):/github/workspace local /github/workspace ${{ matrix.arch }} yes

      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R $(whoami) /opt/llvm-codon
          curl -L https://github.com/exaloop/llvm-project/releases/download/codon-20.1.7/llvm-codon-20.1.7-${{ matrix.arch }}.tar.bz2 | tar jxf - -C /opt
          brew install gcc
          bash .github/build-linux/entrypoint.sh ${{ github.workspace }} ${{ matrix.arch }} yes

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codon-${{ matrix.arch }}.tar.gz
          path: codon-${{ matrix.arch }}.tar.gz

  windows:
    name: Build windows-x86_64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up toolchain on PATH
        shell: pwsh
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install ninja -y --no-progress
          clang --version
          ninja --version

      - name: Cache LLVM fork (MSVC, 20.1.7)
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm
          # bumped to -omp: the cached tree now also holds the GC-patched libomp
          key: windows-msvc-llvm-20-1-7-omp

      - name: Build LLVM 20.1.7 fork (MSVC) if not cached
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 -b codon-20.1.7 https://github.com/exaloop/llvm-project llvm-project
          cmake -S llvm-project/llvm -B llvm-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_HOST_TRIPLE=x86_64-pc-windows-msvc `
            -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-pc-windows-msvc `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_ENABLE_WERROR=OFF `
            -DLLVM_ENABLE_RTTI=ON `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_TARGETS_TO_BUILD=X86 `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_ENABLE_PROJECTS=""
          cmake --build llvm-build --config Release
          cmake --install llvm-build --prefix llvm
          # GC-patched libomp (enables @par). Built standalone with clang-cl so CMake sets
          # MSVC=TRUE -> KMP_MSVC_COMPAT=1 (the pid_t shim etc.); a plain clang build fails.
          # Installed into the LLVM tree so it's part of the cached `llvm` artifact.
          cmake -S llvm-project/openmp -B libomp-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DOPENMP_STANDALONE_BUILD=ON `
            -DLIBOMP_ENABLE_SHARED=ON `
            -DOPENMP_ENABLE_LIBOMPTARGET=OFF
          cmake --build libomp-build --target omp
          Copy-Item libomp-build/runtime/src/libomp.dll llvm/bin/
          Copy-Item libomp-build/runtime/src/libomp.lib llvm/lib/
          Copy-Item libomp-build/runtime/src/omp.h llvm/include/

      - name: Build Codon (Windows/MSVC)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DLLVM_DIR="llvm/lib/cmake/llvm" `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCODON_GPU=OFF
          cmake --build build --config Release
          cmake --install build --prefix codon-deploy

      - name: CIR unit tests (codon_test)
        shell: pwsh
        run: |
          # codon_test is EXCLUDE_FROM_ALL on Windows (it statically links the compiler),
          # so build it explicitly and run the fast in-process IR suite as a regression
          # gate. The SeqTests (compile+run .codon programs) are left out: they're slow
          # and currently surface separate Windows runtime gaps.
          cmake --build build --config Release --target codon_test
          $env:PATH = "$PWD\build;$env:PATH"
          $env:CODON_PATH = "$PWD\stdlib"
          & build/codon_test.exe --gtest_filter=CIRCoreTest.*
          if ($LASTEXITCODE -ne 0) { throw "CIRCoreTest failed" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item codon-deploy/lib/codon/codonc.dll codon-deploy/bin/
          Copy-Item codon-deploy/lib/codon/codonrt.dll codon-deploy/bin/
          Copy-Item codon-deploy/lib/codon/libomp.dll codon-deploy/bin/        # @par
          Copy-Item codon-deploy/lib/codon/libopenblas.dll codon-deploy/bin/   # numpy.linalg
          if (Test-Path codon-deploy/lib/codon/codon_jupyter.dll) {
            Copy-Item codon-deploy/lib/codon/codon_jupyter.dll codon-deploy/bin/
          }
          Compress-Archive -Path codon-deploy -DestinationPath codon-windows-x86_64.zip -Force

      - name: Smoke test (codon run + build)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\codon-deploy\bin;$env:PATH"
          'print("hello from CI windows codon")' | Out-File -Encoding ascii smoke.py
          "def f(n):`n    return n if n < 2 else f(n-1)+f(n-2)`ntry:`n    raise ValueError('x')`nexcept ValueError as e:`n    print('caught', e)`nfinally:`n    print('fin')`nprint(f(10))" | Out-File -Encoding ascii smoke2.py
          & codon-deploy/bin/codon.exe run smoke.py
          if ($LASTEXITCODE -ne 0) { throw "codon run smoke.py failed" }
          & codon-deploy/bin/codon.exe run smoke2.py
          if ($LASTEXITCODE -ne 0) { throw "codon run smoke2.py (try/except) failed" }
          & codon-deploy/bin/codon.exe build smoke2.py -o smoke2.exe
          if ($LASTEXITCODE -ne 0) { throw "codon build smoke2.py failed" }
          & ./smoke2.exe
          if ($LASTEXITCODE -ne 0) { throw "AOT smoke2.exe failed" }
          # OpenMP @par (JIT + AOT)
          "import openmp as omp`nomp.set_num_threads(4)`ns = 0`n@par`nfor i in range(1000):`n    s += i`nprint('parsum', s)" | Out-File -Encoding ascii smoke_omp.py
          & codon-deploy/bin/codon.exe run smoke_omp.py
          if ($LASTEXITCODE -ne 0) { throw "codon run @par failed" }
          & codon-deploy/bin/codon.exe build smoke_omp.py -o smoke_omp.exe
          if ($LASTEXITCODE -ne 0) { throw "codon build @par failed" }
          & ./smoke_omp.exe
          if ($LASTEXITCODE -ne 0) { throw "AOT @par failed" }
          # numpy core (Highway) + linalg (OpenBLAS), JIT + AOT
          "import numpy as np`nprint('npsum', np.arange(10).sum())`nprint('npdet', np.linalg.det(np.array([[3.0,1.0],[1.0,2.0]])))" | Out-File -Encoding ascii smoke_np.py
          & codon-deploy/bin/codon.exe run smoke_np.py
          if ($LASTEXITCODE -ne 0) { throw "codon run numpy failed" }
          & codon-deploy/bin/codon.exe build smoke_np.py -o smoke_np.exe
          if ($LASTEXITCODE -ne 0) { throw "codon build numpy failed" }
          & ./smoke_np.exe
          if ($LASTEXITCODE -ne 0) { throw "AOT numpy failed" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: codon-windows-x86_64
          path: codon-windows-x86_64.zip
