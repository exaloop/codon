name: Codon CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - develop

jobs:
  unicode_tables:
    name: Verify Unicode Tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
      - name: Verify bundle and regeneration
        run: |
          python scripts/unicode/test_tables.py
          python scripts/unicode_tables.py verify
          python scripts/unicode_tables.py fetch --ucd-dir build/unicode-16.0.0
          python scripts/unicode_tables.py regenerate --ucd-dir build/unicode-16.0.0 --output-dir build/unicode-check
          python scripts/unicode_tables.py check --input-dir build/unicode-check

  compile:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-15
            arch: darwin-arm64
    runs-on: ${{ matrix.os }}
    name: Compile Codon
    needs: unicode_tables
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sh .github/ci/build-image.sh "${{ matrix.arch }}"
          docker run --rm -v "$PWD:/github/workspace" local /github/workspace ${{ matrix.arch }} no

      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R "$(whoami)" /opt/llvm-codon
          curl -L https://github.com/exaloop/llvm-project/releases/download/codon-20.1.7/llvm-codon-20.1.7-${{ matrix.arch }}.tar.bz2 | tar jxf - -C /opt
          brew install gcc
          bash .github/ci/entrypoint.sh ${{ github.workspace }} ${{ matrix.arch }} no

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codon-${{ matrix.arch }}.tar.gz
          path: codon-${{ matrix.arch }}.tar.gz

      - name: Upload Test Bundle
        uses: actions/upload-artifact@v7
        with:
          name: codon-tests-${{ matrix.arch }}
          path: codon-tests-${{ matrix.arch }}.tar.gz
          retention-days: 3

      - name: Upload Python Distribution
        if: matrix.arch == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: codon-python
          path: dist/

  test:
    name: Test Codon (${{ matrix.platform.arch }}, shard ${{ matrix.shard }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        platform:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-15
            arch: darwin-arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download SDK
        uses: actions/download-artifact@v8
        with:
          name: codon-${{ matrix.platform.arch }}.tar.gz

      - name: Download Test Bundle
        uses: actions/download-artifact@v8
        with:
          name: codon-tests-${{ matrix.platform.arch }}

      - name: Restore Build
        run: |
          tar xzf codon-${{ matrix.platform.arch }}.tar.gz
          tar xzf codon-tests-${{ matrix.platform.arch }}.tar.gz
          mkdir -p test-results/${{ matrix.platform.arch }}

      - name: Test (Ubuntu)
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          set -o pipefail
          sh .github/ci/build-image.sh "${{ matrix.platform.arch }}"
          docker run --rm -v "$PWD:/github/workspace" local /github/workspace ${{ matrix.platform.arch }} shard ${{ matrix.shard }} 4 \
            2>&1 | tee test-results/${{ matrix.platform.arch }}/shard-${{ matrix.shard }}.log

      - name: Test (macOS)
        if: startsWith(matrix.platform.os, 'macos')
        run: |
          set -o pipefail
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R "$(whoami)" /opt/llvm-codon
          curl -L https://github.com/exaloop/llvm-project/releases/download/codon-20.1.7/llvm-codon-20.1.7-${{ matrix.platform.arch }}.tar.bz2 | tar jxf - -C /opt
          brew install gcc
          bash .github/ci/entrypoint.sh ${{ github.workspace }} ${{ matrix.platform.arch }} shard ${{ matrix.shard }} 4 \
            2>&1 | tee test-results/${{ matrix.platform.arch }}/shard-${{ matrix.shard }}.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform.arch }}-${{ matrix.shard }}
          path: test-results/${{ matrix.platform.arch }}/

  build:
    name: Build Codon
    if: always()
    needs: [compile, test, build_windows]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-15
            arch: darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Require Successful Builds and Tests
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.build_windows.result }}
        run: test "$COMPILE_RESULT" = success && test "$TEST_RESULT" = success && test "$WINDOWS_RESULT" = success

  publish:
    name: Publish Codon
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download SDKs
        uses: actions/download-artifact@v8
        with:
          pattern: codon-*.tar.gz
          path: release/
          merge-multiple: true

      - name: Download Python Distribution
        uses: actions/download-artifact@v8
        with:
          name: codon-python
          path: dist/

      - name: Download Windows SDKs
        uses: actions/download-artifact@v8
        with:
          pattern: codon-windows-*.zip
          path: release/
          merge-multiple: true

      - name: Create Release and Upload SDKs
        if: contains(github.ref, 'tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: release/codon-*.tar.gz,release/codon-windows-*.zip
          artifactErrorsFailBuild: true

      - name: Publish PyPI Package
        uses: pypa/gh-action-pypi-publish@release/v1

  compile_windows:
    name: Compile Codon (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: windows-x86_64
            msvc_arch: amd64
            python_arch: x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    needs: unicode_tables
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install build and test dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: ninja numpy==2.3.4 cython setuptools wheel astunparse
          ninja --version

      - name: Download LLVM release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = "$env:RUNNER_TEMP/llvm-codon-${{ matrix.arch }}.zip"
          curl.exe --fail --location --retry 5 --output $archive `
            "https://github.com/exaloop/llvm-project/releases/download/codon/llvm-codon-${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force C:/opt | Out-Null
          # The release contains llvm-codon/, including Clang and GC-patched libomp.
          tar -xf $archive -C C:/opt

      - name: Build Codon
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          clang --version
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR=C:/opt/llvm-codon/lib/cmake/llvm `
            -DCMAKE_C_COMPILER=C:/opt/llvm-codon/bin/clang.exe `
            -DCMAKE_CXX_COMPILER=C:/opt/llvm-codon/bin/clang++.exe `
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.target }} `
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} `
            -DCODON_GPU=OFF
          cmake --build build --config Release --parallel 2
          cmake --install build --prefix codon-deploy

      - name: Package Test Bundle
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $files = @('build/codon.exe', 'build/codon_test.exe', 'build/stdlib', 'build/codon-utf8.manifest')
          $files += @(Get-ChildItem build -File |
            Where-Object { $_.Extension -in '.dll', '.lib' } |
            ForEach-Object { "build/$($_.Name)" })
          if (Test-Path build/lib/codon) { $files += 'build/lib/codon' }
          tar -czf "codon-tests-${{ matrix.arch }}.tar.gz" @files

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path codon-deploy -DestinationPath codon-${{ matrix.arch }}.zip -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codon-${{ matrix.arch }}.zip
          path: codon-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload Test Bundle
        uses: actions/upload-artifact@v7
        with:
          name: codon-tests-${{ matrix.arch }}
          path: codon-tests-${{ matrix.arch }}.tar.gz
          retention-days: 3
          if-no-files-found: error

  test_windows:
    name: Test Codon (${{ matrix.platform.arch }}, shard ${{ matrix.shard }})
    needs: compile_windows
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        platform:
          - os: windows-latest
            arch: windows-x86_64
            msvc_arch: amd64
            python_arch: x64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.platform.python_arch }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform.msvc_arch }}

      - name: Install test dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: ninja numpy==2.3.4 cython setuptools wheel astunparse

      - name: Download LLVM release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = "$env:RUNNER_TEMP/llvm-codon-${{ matrix.platform.arch }}.zip"
          curl.exe --fail --location --retry 5 --output $archive `
            "https://github.com/exaloop/llvm-project/releases/download/codon/llvm-codon-${{ matrix.platform.arch }}.zip"
          New-Item -ItemType Directory -Force C:/opt | Out-Null
          tar -xf $archive -C C:/opt

      - name: Download SDK
        uses: actions/download-artifact@v8
        with:
          name: codon-${{ matrix.platform.arch }}.zip

      - name: Download Test Bundle
        uses: actions/download-artifact@v8
        with:
          name: codon-tests-${{ matrix.platform.arch }}

      - name: Restore Build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive -Path "codon-${{ matrix.platform.arch }}.zip" -DestinationPath . -Force
          tar -xzf "codon-tests-${{ matrix.platform.arch }}.tar.gz"
          New-Item -ItemType Directory -Force "test-results/${{ matrix.platform.arch }}" | Out-Null

      - name: Install Python JIT package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CODON_DIR = "$PWD/codon-deploy"
          python -m pip install --no-build-isolation "$env:CODON_DIR/python"

      - name: Run test shard
        shell: bash
        env:
          CODON_BUILD_DIR: build
          CODON_DIR: codon-deploy
          CODON_TEST_WORKERS: '1'
        run: |
          set -o pipefail
          bash .github/ci/test.sh "$PWD" "${{ matrix.platform.arch }}" "${{ matrix.shard }}" 4 \
            2>&1 | tee test-results/${{ matrix.platform.arch }}/shard-${{ matrix.shard }}.log

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform.arch }}-${{ matrix.shard }}
          path: test-results/${{ matrix.platform.arch }}/
          if-no-files-found: ignore

  build_windows:
    name: Build and Test Codon (${{ matrix.arch }})
    if: always()
    needs: [compile_windows, test_windows]
    strategy:
      matrix:
        arch: [windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require Successful Windows Build and Tests
        env:
          COMPILE_RESULT: ${{ needs.compile_windows.result }}
          TEST_RESULT: ${{ needs.test_windows.result }}
        run: test "$COMPILE_RESULT" = success && test "$TEST_RESULT" = success

  build_documentation:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          npm ci --prefix docs

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: codon-linux-x86_64.tar.gz
          path: ./downloaded-artifact

      - name: Build API reference
        run: |
          mv downloaded-artifact/* .
          tar -xvzf codon-linux-x86_64.tar.gz
          codon-deploy-linux-x86_64/bin/codon doc codon-deploy-linux-x86_64/lib/codon/stdlib > docs.json
          python scripts/docgen.py docs.json docs/libraries/api "$PWD/codon-deploy-linux-x86_64/lib/codon/stdlib"

      - name: Build and validate Docusaurus site
        run: npm run build --prefix docs

      - name: Upload documentation site
        uses: actions/upload-artifact@v7
        with:
          name: codon-docs
          path: docs/build/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          force_orphan: true
          cname: docs.exaloop.io
