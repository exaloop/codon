name: Codon CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - develop

jobs:
  unicode_tables:
    name: Verify Unicode Tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
      - name: Verify bundle and regeneration
        run: |
          python scripts/unicode/test_tables.py
          python scripts/unicode_tables.py verify
          python scripts/unicode_tables.py fetch --ucd-dir build/unicode-16.0.0
          python scripts/unicode_tables.py regenerate --ucd-dir build/unicode-16.0.0 --output-dir build/unicode-check
          python scripts/unicode_tables.py check --input-dir build/unicode-check

  create_release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, test]
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    permissions:
      contents: write
    steps:
      - name: Create Release
        if: contains(github.ref, 'tags/v')
        id: create_release
        uses: ncipollo/release-action@v1

  compile:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-14
            arch: darwin-arm64
    runs-on: ${{ matrix.os }}
    name: Compile Codon
    needs: unicode_tables
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          (cd .github/ci && docker build -t local -f Dockerfile.${{ matrix.arch }} .)
          docker run --rm -v "$PWD:/github/workspace" local /github/workspace ${{ matrix.arch }} no

      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R "$(whoami)" /opt/llvm-codon
          curl -L https://github.com/exaloop/llvm-project/releases/download/codon-20.1.7/llvm-codon-20.1.7-${{ matrix.arch }}.tar.bz2 | tar jxf - -C /opt
          brew install gcc
          bash .github/ci/entrypoint.sh ${{ github.workspace }} ${{ matrix.arch }} no

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codon-${{ matrix.arch }}.tar.gz
          path: codon-${{ matrix.arch }}.tar.gz

      - name: Upload Test Bundle
        uses: actions/upload-artifact@v7
        with:
          name: codon-tests-${{ matrix.arch }}
          path: codon-tests-${{ matrix.arch }}.tar.gz
          retention-days: 3

      - name: Upload Python Distribution
        if: matrix.arch == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: codon-python
          path: dist/

  test:
    name: Test Codon (${{ matrix.platform.arch }}, shard ${{ matrix.shard }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        platform:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-14
            arch: darwin-arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download SDK
        uses: actions/download-artifact@v8
        with:
          name: codon-${{ matrix.platform.arch }}.tar.gz

      - name: Download Test Bundle
        uses: actions/download-artifact@v8
        with:
          name: codon-tests-${{ matrix.platform.arch }}

      - name: Restore Build
        run: |
          tar xzf codon-${{ matrix.platform.arch }}.tar.gz
          tar xzf codon-tests-${{ matrix.platform.arch }}.tar.gz
          mkdir -p test-results/${{ matrix.platform.arch }}

      - name: Test (Ubuntu)
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          set -o pipefail
          (cd .github/ci && docker build -t local -f Dockerfile.${{ matrix.platform.arch }} .)
          docker run --rm -v "$PWD:/github/workspace" local /github/workspace ${{ matrix.platform.arch }} shard ${{ matrix.shard }} 4 \
            2>&1 | tee test-results/${{ matrix.platform.arch }}/shard-${{ matrix.shard }}.log

      - name: Test (macOS)
        if: startsWith(matrix.platform.os, 'macos')
        run: |
          set -o pipefail
          sudo mkdir -p /opt/llvm-codon
          sudo chown -R "$(whoami)" /opt/llvm-codon
          curl -L https://github.com/exaloop/llvm-project/releases/download/codon-20.1.7/llvm-codon-20.1.7-${{ matrix.platform.arch }}.tar.bz2 | tar jxf - -C /opt
          brew install gcc
          bash .github/ci/entrypoint.sh ${{ github.workspace }} ${{ matrix.platform.arch }} shard ${{ matrix.shard }} 4 \
            2>&1 | tee test-results/${{ matrix.platform.arch }}/shard-${{ matrix.shard }}.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform.arch }}-${{ matrix.shard }}
          path: test-results/${{ matrix.platform.arch }}/

  build:
    name: Build Codon
    if: always()
    needs: [compile, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: ubuntu-latest
            arch: manylinux2014-x86_64
          - os: ubuntu-24.04-arm
            arch: linux-aarch64
          - os: ubuntu-24.04-arm
            arch: manylinux2014-aarch64
          - os: macos-14
            arch: darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Require Successful Builds and Tests
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$COMPILE_RESULT" = success && test "$TEST_RESULT" = success

  publish:
    name: Publish Codon (${{ matrix.arch }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [build, test, create_release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [linux-x86_64, manylinux2014-x86_64, linux-aarch64, manylinux2014-aarch64, darwin-arm64]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download SDK
        uses: actions/download-artifact@v8
        with:
          name: codon-${{ matrix.arch }}.tar.gz

      - name: Upload Release Asset
        if: contains(github.ref, 'tags/v')
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./codon-${{ matrix.arch }}.tar.gz
          asset_name: codon-${{ matrix.arch }}.tar.gz
          asset_content_type: application/gzip

      - name: Download Python Distribution
        if: matrix.arch == 'linux-x86_64'
        uses: actions/download-artifact@v8
        with:
          name: codon-python
          path: dist/

      - name: Publish PyPI Package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags') && matrix.arch == 'linux-x86_64'
        uses: pypa/gh-action-pypi-publish@release/v1

  build_documentation:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install properdocs \
                                mkdocs-autorefs \
                                mkdocs-macros-plugin \
                                mkdocs-material \
                                mkdocs-material-extensions \
                                mkdocs-redirects
          sudo apt-get update
          sudo apt-get install -y pngquant

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: codon-linux-x86_64.tar.gz
          path: ./downloaded-artifact

      - name: Build API reference
        run: |
          mv downloaded-artifact/* .
          tar -xvzf codon-linux-x86_64.tar.gz
          codon-deploy-linux-x86_64/bin/codon doc codon-deploy-linux-x86_64/lib/codon/stdlib > docs.json
          python scripts/docgen.py docs.json docs/libraries/api "$PWD/codon-deploy-linux-x86_64/lib/codon/stdlib"

      - name: Build MkDocs site
        run: properdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          cname: docs.exaloop.io
